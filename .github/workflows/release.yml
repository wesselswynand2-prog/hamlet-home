name: Release

# Bump "version" in manifest.json and push to main: if there is no release for
# that version yet, this creates tag v<version> and a GitHub release with the zip.
# HACS then offers the update on every Home Assistant that installed it.
on:
  push:
    branches: [main]
    paths: ["custom_components/hamlet_home/manifest.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/hamlet_home/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip (for the upload + terminal-command install)
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p out/hamlet-home && cp -r custom_components README.md out/hamlet-home/
          [ -f hamlet-update.sh ] && cp hamlet-update.sh out/hamlet-home/ || true
          cd out && zip -qr ../hamlet-home.zip hamlet-home
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: hamlet-home.zip
          generate_release_notes: true
