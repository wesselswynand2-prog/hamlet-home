name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics license

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v5
        with:
          repository: wesselswynand2-prog/hamlet-geyser
          path: _geyser
      - run: pip install -r requirements_test.txt
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider 2>&1 | tee pytest.log || {
            grep -E "^(E  |FAILED|ERROR)" pytest.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
        env:
          HAMLET_EXTRA_COMPONENTS: _geyser/custom_components
